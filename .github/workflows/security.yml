name: security-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13"}
      # 운영 이미지와 같이 해시를 고정한 잠금 파일로 설치한다(Python 3.13 + ocr·dev)
      - run: pip install --require-hashes -r requirements-ci.lock && pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y --no-install-recommends fonts-nanum  # 보고서 PDF 시험
      - name: tests (단위 + 브라우저 통합)
        run: pytest -q
      - name: bandit
        run: bandit -r safetrace -ll
      - name: 약점 밀도 (전체 등급, 보고만 하고 실패시키지 않음)
        if: always()
        continue-on-error: true
        run: python ../tools/weakness_density.py >> "$GITHUB_STEP_SUMMARY"
      - name: pip-audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "24"}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    container: {image: "semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b"}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: semgrep scan --config p/python --config p/react --config p/secrets --error --exclude testpages

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
