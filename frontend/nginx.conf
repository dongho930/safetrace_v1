# 연결 업그레이드는 실시간 화면 WebSocket 만, 값은 websocket 으로 고정한다. 다른 값(h2c 등)은 API 로 넘기지 않는다
# (semgrep possible-nginx-h2c-smuggling 지적, 2026-10-25)
map $http_upgrade $ws_connection {
  default close;
  ~*^websocket$ upgrade;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; media-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  # 실시간 화면 WebSocket(/api/cases/{id}/live)만 업그레이드를 넘긴다
  location ~ "^/api/cases/[0-9a-f-]{36}/live$" {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade websocket;
    proxy_set_header Connection $ws_connection;
    proxy_read_timeout 3600s;
  }
  # 나머지 API 는 업그레이드 머리를 넘기지 않는다(nginx 기본: Upgrade 를 넘기지 않고 Connection: close)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    # 접속 주소(로그인 제한용). 사용자가 보낸 X-Forwarded-For 는 덧붙이지 않고 덮어쓴다
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;            # SSE
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
}
