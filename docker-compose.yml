# SafeTrace 전체 구성.
#
# 네트워크 분리
#   core     : api, db, redis, decision          (DB 는 core 에만 있음)
#   sandbox  : agent, egress, redis, decision   (internal: 외부로 직접 나갈 수 없음)
#   outside  : egress 만 연결 (인터넷 출구 1곳)
#
# 에이전트 워커는 DB 접속 정보도 Jev API 키도 없다. 외부 접속은 egress 검문 프록시로만 나간다.
# 증거 볼륨은 agent 가 쓰고 api 는 읽기 전용으로 마운트한다.

name: safetrace_v1  # 다른 로컬 safetrace 프로젝트와 볼륨·네트워크가 겹치지 않게

# 공용 env_file 을 쓰지 않는다: 서비스마다 필요한 비밀값만 명시적으로 넘긴다.
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

services:
  db:
    <<: *common
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: safetrace
      POSTGRES_USER: safetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [core]

  redis:
    <<: *common
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    networks: [core, sandbox]

  api:
    <<: *common
    build: ./backend
    environment:
      ST_DATABASE_URL: postgresql+psycopg://safetrace:${POSTGRES_PASSWORD}@db:5432/safetrace
      ST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ST_EVIDENCE_DIR: /evidence
      ST_EVIDENCE_HMAC_KEY: ${ST_EVIDENCE_HMAC_KEY:?}   # 검증용
      ST_EVIDENCE_KEY_ID: ${ST_EVIDENCE_KEY_ID:-k1}
      ST_API_TOKENS: ${ST_API_TOKENS:-[]}
      ST_CORS_ORIGINS: ${ST_CORS_ORIGINS:-["http://localhost:8080"]}
      ST_ALLOWED_PORTS: "[80,443]"
    volumes: [evidence:/evidence:ro]
    read_only: true
    tmpfs: [/tmp]
    depends_on: [db, redis]
    networks: [core]

  decision:
    <<: *common
    build: ./backend
    command: ["uvicorn", "safetrace.decision.service:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      # 판단 서비스만 Jev 키를 가진다. DB·증거에는 접근하지 않는다.
      ST_DATABASE_URL: "sqlite:////tmp/unused.db"
      ST_DECISION_TOKEN: ${ST_DECISION_TOKEN:?}
      ST_TYPESAFE_API_KEY: ${ST_TYPESAFE_API_KEY:-}
      ST_OPENROUTER_API_KEY: ${ST_OPENROUTER_API_KEY:-}
      ST_JEV_MODEL: ${ST_JEV_MODEL:-jev-1.13.0}
      ST_OPENROUTER_JEV_MODEL: ${ST_OPENROUTER_JEV_MODEL:-typesafe/jev-1.13}
      ST_DECIDER_CHAIN: ${ST_DECIDER_CHAIN:-["jev_typesafe","jev_openrouter","rules"]}
    read_only: true
    tmpfs: [/tmp]
    networks: [sandbox, outside]  # Jev API 호출용 출구

  egress:
    <<: *common
    build: ./backend
    command: ["python", "-m", "safetrace.proxy.egress", "--host", "0.0.0.0", "--port", "3128", "--resolve-port", "3129"]
    environment:
      ST_EGRESS_PORTS: "80,443"
      ST_EGRESS_TEST_ALLOWLIST: ${ST_EGRESS_TEST_ALLOWLIST:-}
    read_only: true
    networks: [sandbox, outside]

  agent:
    <<: *common
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    environment:
      ST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ST_DECISION_URL: http://decision:8100
      ST_DECISION_TOKEN: ${ST_DECISION_TOKEN:?}
      ST_EGRESS_PROXY: http://egress:3128
      ST_RESOLVER_URL: http://egress:3129   # 격리망 안 1차 IP 확인
      ST_EVIDENCE_DIR: /evidence
      ST_EVIDENCE_HMAC_KEY: ${ST_EVIDENCE_HMAC_KEY:?}   # 서명용
      ST_EVIDENCE_KEY_ID: ${ST_EVIDENCE_KEY_ID:-k1}
      ST_SAFEBROWSING_API_KEY: ${ST_SAFEBROWSING_API_KEY:-}
      ST_TEST_ALLOWLIST: ${ST_TEST_ALLOWLIST:-[]}
      # DB 접속 정보·Jev 키는 넘기지 않는다
    volumes: [evidence:/evidence]
    cap_drop: [ALL]
    shm_size: 1gb
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    depends_on: [redis, decision, egress]
    networks: [sandbox]

  web:
    <<: *common
    build: ./frontend
    ports: ["127.0.0.1:${ST_WEB_PORT:-8080}:8080"]
    depends_on: [api]
    networks: [core]

  # 시연용 시험 페이지(선택): docker compose --profile demo up
  testpages:
    image: python:3.13-slim
    profiles: [demo]
    working_dir: /site
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8900"]
    volumes: ["./testpages:/site:ro"]
    networks:
      outside:
        aliases: [testpages-alt]   # 도메인 경유(hop.html) 시연용 두 번째 이름

networks:
  core: {}
  sandbox: {internal: true}
  outside: {}

volumes:
  pgdata: {}
  evidence: {}
