# SafeTrace 전체 구성.
#
# 네트워크 분리
#   core     : api, db, redis, decision          (DB 는 core 에만 있음)
#   sandbox  : agent, feeder, egress, redis, decision   (internal: 외부로 직접 나갈 수 없음)
#   outside  : egress 만 연결 (인터넷 출구 1곳)
#   signing  : signer, agent, api                (internal: 서명 서비스 전용)
#
# 에이전트 워커는 DB 접속 정보도 Jev API 키도 증거 서명 키도 없다. 외부 접속은 egress 검문 프록시로만 나간다.
# 증거 볼륨은 agent 가 쓰고 api 는 읽기 전용으로 마운트한다. 서명은 signer 가 하고 키는 signer 와 api(검증)만 가진다.
# 자동 수집의 피드 받기는 브라우저 조사 워커(agent)가 아니라 feeder 가 하고, 결과 서명 키는 feeder 와 api 만 가진다.

name: safetrace_v1  # 다른 로컬 safetrace 프로젝트와 볼륨·네트워크가 겹치지 않게

# 공용 env_file 을 쓰지 않는다: 서비스마다 필요한 비밀값만 명시적으로 넘긴다.
x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

services:
  db:
    <<: *common
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: safetrace
      POSTGRES_USER: safetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [core]

  redis:
    <<: *common
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    networks: [core, sandbox]

  api:
    <<: *common
    build: ./backend
    environment:
      ST_DATABASE_URL: postgresql+psycopg://safetrace:${POSTGRES_PASSWORD}@db:5432/safetrace
      ST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ST_EVIDENCE_DIR: /evidence
      ST_EVIDENCE_HMAC_KEY: ${ST_EVIDENCE_HMAC_KEY:?}   # 검증용
      ST_EVIDENCE_KEY_ID: ${ST_EVIDENCE_KEY_ID:-k1}
      ST_SIGNER_URL: http://signer:8200
      ST_SIGNER_API_TOKEN: ${ST_SIGNER_API_TOKEN:?}   # 체인 열기·닫기·head 조회
      ST_API_TOKENS: ${ST_API_TOKENS:-[]}
      ST_CORS_ORIGINS: ${ST_CORS_ORIGINS:-["http://localhost:8080"]}
      ST_ALLOWED_PORTS: "[80,443]"
      ST_TRUSTED_PROXIES: '["web"]'   # 로그인 제한에 쓸 접속 주소: web(nginx)이 넘긴 X-Forwarded-For 만 믿는다
      ST_FEED_KEY: ${ST_FEED_KEY:?}   # 자동 수집 피드 결과의 feeder 서명 확인용
      # 자동 수집 한도(.env 로 바꿀 수 있다): 24시간 사건, 끝나지 않은 자동 사건, 한 번 받기에서 고르는 수, 대기열 보관 시간
      ST_INTAKE_DAILY_MAX: ${ST_INTAKE_DAILY_MAX:-120}
      ST_INTAKE_MAX_PENDING: ${ST_INTAKE_MAX_PENDING:-1}
      ST_INTAKE_ROUND_MAX: ${ST_INTAKE_ROUND_MAX:-30}
      ST_INTAKE_ITEM_MAX_AGE_H: ${ST_INTAKE_ITEM_MAX_AGE_H:-12}
    volumes: [evidence:/evidence:ro]
    read_only: true
    tmpfs: [/tmp]
    depends_on: [db, redis, signer]
    networks: [core, signing]

  signer:
    <<: *common
    build: ./backend
    # 동시 연결 한도: 뚫린 에이전트가 요청을 몰아 보내도 메모리 한도(기록 1MiB × 연결 수) 안에 머문다
    command: ["uvicorn", "--factory", "safetrace.signer.service:create_app", "--host", "0.0.0.0", "--port", "8200",
              "--limit-concurrency", "32"]
    environment:
      # 증거 서명 키는 이 서비스(서명)와 api(검증)만 가진다. DB·증거 파일·외부망에는 닿지 않는다.
      ST_DATABASE_URL: "sqlite:////tmp/unused.db"
      ST_EVIDENCE_HMAC_KEY: ${ST_EVIDENCE_HMAC_KEY:?}
      ST_EVIDENCE_KEY_ID: ${ST_EVIDENCE_KEY_ID:-k1}
      ST_SIGNER_AGENT_TOKEN: ${ST_SIGNER_AGENT_TOKEN:?}
      ST_SIGNER_API_TOKEN: ${ST_SIGNER_API_TOKEN:?}
      ST_SIGNER_STATE_PATH: /state/signer.db
    volumes: [signer-state:/state]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "1", memory: 256m}
    networks: [signing]

  decision:
    <<: *common
    build: ./backend
    command: ["uvicorn", "safetrace.decision.service:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      # 판단 서비스만 Jev 키를 가진다. DB·증거에는 접근하지 않는다.
      ST_DATABASE_URL: "sqlite:////tmp/unused.db"
      ST_DECISION_TOKEN: ${ST_DECISION_TOKEN:?}
      ST_TYPESAFE_API_KEY: ${ST_TYPESAFE_API_KEY:-}
      ST_OPENROUTER_API_KEY: ${ST_OPENROUTER_API_KEY:-}
      ST_JEV_MODEL: ${ST_JEV_MODEL:-jev-1.13.0}
      ST_OPENROUTER_JEV_MODEL: ${ST_OPENROUTER_JEV_MODEL:-typesafe/jev-1.13}
      ST_DECIDER_CHAIN: ${ST_DECIDER_CHAIN:-["jev_typesafe","jev_openrouter","rules"]}
    read_only: true
    tmpfs: [/tmp]
    networks: [sandbox, outside]  # Jev API 호출용 출구

  egress:
    <<: *common
    build: ./backend
    command: ["python", "-m", "safetrace.proxy.egress", "--host", "0.0.0.0", "--port", "3128", "--resolve-port", "3129"]
    environment:
      ST_EGRESS_PORTS: "80,443"
      ST_EGRESS_TEST_ALLOWLIST: ${ST_EGRESS_TEST_ALLOWLIST:-}
    read_only: true
    networks: [sandbox, outside]

  agent:
    <<: *common
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
      additional_contexts:
        tools: ./tools   # 한국어 OCR 모델 받기 스크립트
    environment:
      ST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ST_DECISION_URL: http://decision:8100
      ST_DECISION_TOKEN: ${ST_DECISION_TOKEN:?}
      ST_EGRESS_PROXY: http://egress:3128
      ST_RESOLVER_URL: http://egress:3129   # 격리망 안 1차 IP 확인
      ST_EVIDENCE_DIR: /evidence
      ST_SIGNER_URL: http://signer:8200   # 서명은 서명 서비스에 맡긴다(키 없음)
      ST_SIGNER_AGENT_TOKEN: ${ST_SIGNER_AGENT_TOKEN:?}
      ST_SAFEBROWSING_API_KEY: ${ST_SAFEBROWSING_API_KEY:-}
      ST_TEST_ALLOWLIST: ${ST_TEST_ALLOWLIST:-[]}
      # DB 접속 정보·Jev 키·증거 서명 키는 넘기지 않는다
    volumes: [evidence:/evidence]
    cap_drop: [ALL]
    shm_size: 1gb
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    depends_on: [redis, decision, egress, signer]
    networks: [sandbox, signing]

  # 자동 수집의 피드 받기(공개 피싱 피드). 조사 대상 페이지를 열지 않는 작은 컨테이너라 브라우저 워커와 떨어뜨린다.
  # 바깥은 검문 프록시로만, 결과는 ST_FEED_KEY 로 서명한다(브라우저 워커에는 이 키가 없다). DB·증거·Jev 키 없음
  feeder:
    <<: *common
    build: ./backend
    command: ["python", "-m", "safetrace.agent.feeder"]
    environment:
      ST_DATABASE_URL: "sqlite:////tmp/unused.db"
      ST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ST_EGRESS_PROXY: http://egress:3128
      ST_FEED_KEY: ${ST_FEED_KEY:?}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}
    depends_on: [redis, egress]
    networks: [sandbox]

  web:
    <<: *common
    build: ./frontend
    ports: ["127.0.0.1:${ST_WEB_PORT:-8080}:8080"]
    depends_on: [api]
    networks: [core]

  # 시연용 시험 페이지(선택): docker compose --profile demo up
  testpages:
    image: python:3.13-slim@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
    profiles: [demo]
    working_dir: /site
    command: ["python", "server.py", "--host", "0.0.0.0", "--port", "8900"]
    volumes: ["./testpages:/site:ro"]
    networks:
      outside:
        aliases: [testpages-alt]   # 도메인 경유(hop.html) 시연용 두 번째 이름

networks:
  core: {}
  sandbox: {internal: true}
  signing: {internal: true}
  outside: {}

volumes:
  pgdata: {}
  evidence: {}
  signer-state: {}
