<h1>보안 앱 설치 방법</h1>
<ol>
<li><p>휴대폰 설정에서 '출처를 알 수 없는 앱 설치'를 허용합니다.</p><div style="height:320px"></div></li>
<li><p>내려받은 파일을 열어 설치를 누릅니다. 경고 창이 나오면 '무시하고 설치'를 선택합니다.</p><div style="height:320px"></div></li>
<li><p>앱을 실행하고 접근성 권한과 문자 읽기 권한을 모두 허용합니다.</p><div style="height:320px"></div></li>
<li><p>설치가 끝나면 아래 버튼으로 마지막 단계를 진행합니다.</p></li>
</ol>
